name: release
# Tag-triggered release (docs/RELEASING.md §4): a `v*` tag runs the full CI
# (ci.yml) on the tagged commit, and only if every CI job passes stamps the
# RPM version from the tag, pushes the container image to GHCR, and attaches
# RPM + SRPM + dist tarball + SHA256SUMS + a provenance bundle to the GitHub
# release. Signing (rpmsign / cosign) is still manual.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Never cancel a half-published release; a re-pushed tag waits its turn.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Third-party actions are pinned to commit SHAs (tag in the trailing comment);
# Dependabot (.github/dependabot.yml) keeps the pins current.
jobs:
  # Cheap checks first, so a mistyped tag fails before the CI run starts.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      rpm_version: ${{ steps.version.outputs.rpm_version }}
      rpm_release: ${{ steps.version.outputs.rpm_release }}
      rpm_suffix: ${{ steps.version.outputs.rpm_suffix }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Tag -> versions. v1.2.0 is RPM 1.2.0-1; v1.2.0-rc.1 is RPM
      # 1.2.0-0.1.rc.1, so every pre-release sorts below the final 1.2.0-1.
      # The tag must match app/package.json, which feeds the About dialog.
      - id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-([0-9A-Za-z]+(\.[0-9A-Za-z]+)*))?$ ]]; then
            echo "::error::tag ${TAG} is not v<major>.<minor>.<patch>[-<pre>]"; exit 1
          fi
          version="${TAG#v}"
          pkg_version=$(jq -r .version app/package.json)
          if [ "${pkg_version}" != "${version}" ]; then
            echo "::error::tag ${TAG} does not match app/package.json version ${pkg_version}"; exit 1
          fi
          pre="${BASH_REMATCH[3]}"
          {
            echo "version=${version}"
            echo "rpm_version=${BASH_REMATCH[1]}"
            if [ -n "${pre}" ]; then
              echo "rpm_release=0.1"
              echo "rpm_suffix=.${pre}"
              echo "prerelease=true"
            else
              echo "rpm_release=1"
              echo "rpm_suffix="
              echo "prerelease=false"
            fi
          } >> "${GITHUB_OUTPUT}"

  # The release gate: lint, typecheck, unit tests, build, npm audit, e2e, the
  # container build and the throwaway rpmbuild, all on the tagged commit.
  # Its `app` job also uploads the `app-dist` artifact the RPM below ships.
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # Same recipe as the ci.yml `rpm` job, with the real version from the tag,
  # packaging the exact dist CI just tested.
  rpm:
    runs-on: ubuntu-latest
    needs: [version, ci]
    container: almalinux:9
    steps:
      - run: dnf install -y --setopt=install_weak_deps=False git-core rpm-build tar gzip
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-dist
          path: app/dist
      - name: rpmbuild -ta (pre-bundled dist)
        env:
          VERSION: ${{ needs.version.outputs.version }}
          RPM_VERSION: ${{ needs.version.outputs.rpm_version }}
          RPM_RELEASE: ${{ needs.version.outputs.rpm_release }}
          RPM_SUFFIX: ${{ needs.version.outputs.rpm_suffix }}
        run: |
          sed -i \
            -e "s/@PACKAGE_RPM_VERSION@/${RPM_VERSION}/" \
            -e "s/@PACKAGE_RPM_RELEASE@/${RPM_RELEASE}/" \
            -e "s/@PACKAGE_RPM_SUFFIX@/${RPM_SUFFIX}/" \
            packaging/ovirt-web-ui-ng.spec
          tar czf "ovirt-web-ui-ng-${RPM_VERSION}.tar.gz" \
            --transform "s,^,ovirt-web-ui-ng-${RPM_VERSION}/," \
            app/dist app/README.md packaging LICENSE
          rpmbuild -ta "ovirt-web-ui-ng-${RPM_VERSION}.tar.gz" \
            --define "_topdir ${PWD}/rpmbuild"
          mkdir -p out
          cp rpmbuild/RPMS/noarch/*.rpm rpmbuild/SRPMS/*.src.rpm out/
          rpm -qip out/*.noarch.rpm
          # The same dist as a plain tarball, for static deploys without RPM.
          tar czf "out/ovirt-web-ui-ng-dist-${VERSION}.tar.gz" \
            -C app --transform "s,^dist,ovirt-web-ui-ng-dist-${VERSION}," dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: out/
          retention-days: 7

  image:
    runs-on: ubuntu-latest
    needs: [version, ci]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GHCR names must be lowercase; `latest` only moves on final releases.
      - id: meta
        env:
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          image="ghcr.io/${REPO,,}"
          tags="${image}:${VERSION}"
          [ "${PRERELEASE}" = "true" ] || tags="${tags},${image}:latest"
          {
            echo "image=${image}"
            echo "tags=${tags}"
          } >> "${GITHUB_OUTPUT}"
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packaging/Containerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # image.source links the package to this repo's Packages sidebar.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    runs-on: ubuntu-latest
    needs: [version, rpm, image]
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: out
      - name: SHA256SUMS
        working-directory: out
        run: |
          sha256sum -- * > ../SHA256SUMS
          mv ../SHA256SUMS . && cat SHA256SUMS
      - id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: out/SHA256SUMS
      # Releases created by hand (gh release create) get the assets added;
      # otherwise the release is created here with generated notes.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          cp "${BUNDLE}" "out/ovirt-web-ui-ng-${VERSION}.provenance.sigstore.json"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" out/* --clobber
          else
            flags=()
            [ "${PRERELEASE}" = "true" ] && flags+=(--prerelease)
            gh release create "${TAG}" out/* --verify-tag --title "${TAG}" \
              --generate-notes "${flags[@]}"
          fi
