# nginx-sample.conf -- same-origin reverse proxy + static SPA host.
#
# Used by the Containerfile (and copyable onto any nginx host). Everything the
# browser hits is same-origin on THIS server: our static app under
# /ovirt-engine/web-ui-ng/ and an ALLOWLIST of engine API paths (REST, SSO
# token grant, sign-out, Grafana query API) proxied to ${ENGINE_ORIGIN}. No
# CORS surface in any tier; no engine HTML ever served from this origin.
#
# ${ENGINE_ORIGIN} and ${CSP_CONNECT_EXTRA} are substituted at container
# start (envsubst) -- e.g. https://engine.lab.example.com and (multi-engine
# only) " https://engine2.example.com https://engine3.example.com". When
# copying this onto a bare nginx host, replace both by hand
# (CSP_CONNECT_EXTRA is usually just empty).
#
# Security response headers mirror docs/SECURITY-HEADERS.md. frame-ancestors is
# expressible ONLY as a header (the app's <meta> CSP cannot set it), so it lives
# here; the rest of the CSP duplicates the meta so the header is authoritative.

# Cache policy by extension. Content-hashed assets are immutable; everything
# else (notably index.html) must revalidate so clients never pin a stale asset
# manifest. Driven off the request URI so we keep ONE location block below and
# avoid nginx's add_header inheritance trap (an inner add_header replaces, not
# merges, the parent's -- which would silently drop the security headers).
# API responses are bearer-authenticated JSON: never cacheable by any
# intermediary, never sniffable. Empty value => nginx omits the header, so the
# engine's own caching for anything else it serves through the proxy stands.
map $uri $ovirt_api_cache_control {
    default                 "";
    "~^/ovirt-engine/api"   "no-store";
}

map $uri $ovirt_cache_control {
    default                                       "no-cache, no-store, must-revalidate";
    # config.js is deploy-time config edited in place — never cache it. Listed
    # BEFORE the immutable rule so this regex wins (nginx map: first match).
    "~*/config\.js$"                              "no-cache, no-store, must-revalidate";
    # Only the content-hashed build output under assets/ is immutable; the
    # unhashed root files (favicon*.svg, icons) fall through to revalidate.
    "~*^/ovirt-engine/web-ui-ng/assets/.*\.(?:js|css|woff2?|svg|png|jpe?g|gif|ico)$" "public, max-age=31536000, immutable";
}

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    # SPA build lives here (copied in by the Containerfile).
    root /usr/share/nginx/html;
    index index.html;

    # Reasonable upload ceiling; the API proxies below inherit it.
    client_max_body_size 64m;

    # --- Static app ---------------------------------------------------------
    # Served at the same sub-path the engine host would use, so the app's Vite
    # `base` and injected token flow behave identically to the RPM deploy.
    location ^~ /ovirt-engine/web-ui-ng/ {
        # try the real file, else fall back to index.html for client routing.
        try_files $uri $uri/ /ovirt-engine/web-ui-ng/index.html;

        # Cache policy from the $uri map above (immutable assets vs no-store HTML).
        add_header Cache-Control $ovirt_cache_control always;

        # Multi-engine: ${CSP_CONNECT_EXTRA} (envsubst, default empty) appends
        # engine origins to connect-src so the console may fetch the engines
        # listed in config.js — e.g. " https://engine2.example.com" (space-
        # separated origins). Empty keeps the strict single-engine policy.
        # The Containerfile bakes a matching __CSP_CONNECT_EXTRA__ placeholder
        # into index.html's <meta> CSP; sub_filter swaps it with the SAME
        # value at serve time so header and meta never disagree.
        sub_filter '__CSP_CONNECT_EXTRA__' '${CSP_CONNECT_EXTRA}';
        sub_filter_once on;

        # Security headers (see docs/SECURITY-HEADERS.md). `always` so they are
        # emitted on error responses too. Single location => no add_header
        # inheritance surprises; all responses under the sub-path get these.
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss: ${CSP_CONNECT_EXTRA}; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        # Second-tier isolation (docs/SECURITY-HEADERS.md): our documents never
        # need a cross-origin opener or embedder, and no other origin may load
        # our assets. The console tab is same-origin, so its opener/postMessage
        # handshake is unaffected by COOP same-origin. No feature the app uses
        # is disabled by the Permissions-Policy list (fullscreen stays default).
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), midi=(), magnetometer=(), gyroscope=(), accelerometer=(), display-capture=()" always;

        # Serve the assets the Containerfile precompressed at build time
        # (gzip -9, one CPU cost at build instead of per request). index.html
        # is not precompressed, so sub_filter still applies to it.
        gzip_static on;
    }

    # Convenience redirect: bare sub-path without trailing slash.
    location = /ovirt-engine/web-ui-ng {
        return 301 /ovirt-engine/web-ui-ng/;
    }

    # --- Engine reverse proxy ----------------------------------------------
    # ALLOWLISTED PATHS ONLY — the four surfaces the SPA needs (the same set as
    # the multi-engine deploy config): REST, the SSO token grant, the
    # token-scoped sign-out, and Grafana's query API for the history charts.
    # The engine's own HTML (webadmin, the legacy portal, SSO login pages, the
    # Grafana UI) is deliberately unreachable through this origin: proxying it
    # would run that markup same-origin with the console's session store. The
    # in-browser console does not come through here either — noVNC opens
    # wss:// straight to the engine's websocket-proxy (WebSocketProxy option).
    location ~ ^/(?:ovirt-engine/(?:api(?:/|$)|sso/oauth/token$|services/sso-logout$)|ovirt-engine-grafana/api/) {
        # ${ENGINE_ORIGIN} is replaced by envsubst at container start with a
        # LITERAL origin (scheme+host[:port], NO trailing slash, NO path), e.g.
        # https://engine.local. With no URI part nginx forwards the request
        # URI unchanged (re-escaped). Keep that bare-origin form if you
        # hand-edit this on a bare host.
        proxy_pass ${ENGINE_ORIGIN};

        # Bearer-authenticated API responses: no intermediary caching, no
        # sniffing (the map leaves Cache-Control off for the Grafana API).
        add_header Cache-Control $ovirt_api_cache_control always;
        add_header X-Content-Type-Options "nosniff" always;

        # Login abuse control: the zone (nginx.conf.template) only counts SSO
        # token requests, so this throttles password guessing per client
        # address and nothing else. 10/min + burst 5 is generous for humans
        # and password managers; excess gets 429, which the login form reports.
        limit_req zone=sso_login burst=5 nodelay;

        # Preserve host so the engine's SSO/redirects build correct URLs.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # API calls are short (the app's own client timeout is 30s); no
        # long-lived sockets ride this path.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;

        # SECURE BY DEFAULT (docs/SECURITY.md §4): verify the engine's TLS cert
        # on the nginx->engine hop so an attacker on that network path cannot
        # MITM the bearer-token traffic with a forged cert. Point
        # proxy_ssl_trusted_certificate at the engine CA bundle.
        #   For a LAB with self-signed engine certs ONLY, flip to `off` — an
        #   explicit, commented opt-in, never the shipped default.
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/pki/ovirt-engine/ca.pem;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_server_name on;
    }

    # Anything else under the engine paths: 404, never the engine.
    location /ovirt-engine/ {
        return 404;
    }
    location /ovirt-engine-grafana/ {
        return 404;
    }

    # Land the bare site root on the app.
    location = / {
        return 302 /ovirt-engine/web-ui-ng/;
    }
}
